<path d="M236 196 C262 182 267 158 249 147 C244 127 221 124 209 139 C196 135 183 145 183 160 C186 178 210 190 236 196Z" fill="#f5fbff" opacity=".8"/>
</g><g fill="#fff" opacity=".75"><circle cx="79" cy="218" r="3"/><circle cx="238" cy="209" r="2.5"/></g>
</svg>