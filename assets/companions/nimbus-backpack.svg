<path d="M86 191 Q66 204 66 250 L72 286 Q91 300 113 287 L119 220 Q112 195 86 191Z" fill="url(#pack)" stroke="#0a2437" stroke-width="5"/>
<path d="M78 220 Q94 210 112 220" fill="none" stroke="#63a8cf" stroke-width="5" opacity=".65"/>
<rect x="80" y="238" width="27" height="24" rx="7" fill="#0d3450" stroke="#75b9db" stroke-width="3"/>
<path d="M103 91 L84 48 L133 74Z" fill="#9bb9ca"/><path d="M217 91 L236 48 L187 74Z" fill="#9bb9ca"/>
<ellipse cx="160" cy="139" rx="78" ry="72" fill="url(#b)"/><path d="M109 143 Q160 183 211 143 Q198 195 160 203 Q122 195 109 143Z" fill="url(#c)" opacity=".88"/>
<g id="eyes"><ellipse cx="130" cy="129" rx="12" ry="15" fill="#17364e"/><ellipse cx="190" cy="129" rx="12" ry="15" fill="#17364e"/><ellipse cx="130" cy="126" rx="5" ry="8" fill="#43d7ff"/><ellipse cx="190" cy="126" rx="5" ry="8" fill="#43d7ff"/><circle cx="133" cy="121" r="3" fill="#fff"/><circle cx="193" cy="121" r="3" fill="#fff"/></g>
<path d="M151 158 Q160 165 169 158 Q160 176 151 158Z" fill="#395267"/>
<path d="M107 201 Q160 176 213 201 L204 292 Q160 324 116 292Z" fill="url(#b)"/><path d="M140 205 Q160 192 180 205 L177 274 Q160 291 143 274Z" fill="url(#c)"/>
<!-- backpack straps -->
<path d="M116 194 Q126 219 132 259" fill="none" stroke="url(#strap)" stroke-width="11" stroke-linecap="round"/>
<path d="M204 194 Q194 219 188 259" fill="none" stroke="url(#strap)" stroke-width="11" stroke-linecap="round"/>
<rect x="120" y="216" width="16" height="13" rx="3" fill="#91a9b7" stroke="#2a3c49" stroke-width="3"/>
<rect x="184" y="216" width="16" height="13" rx="3" fill="#91a9b7" stroke="#2a3c49" stroke-width="3"/>
<!-- glowing quest badge -->
<circle id="badgeGlow" cx="160" cy="242" r="31" fill="#19cfff" opacity=".35" filter="url(#g)"/>
<circle cx="160" cy="242" r="24" fill="#052f49" stroke="#d8fbff" stroke-width="4"/>
<circle cx="160" cy="242" r="16" fill="url(#glow)" stroke="#74f3ff" stroke-width="3"/>
<circle cx="160" cy="242" r="7" fill="#fff"/>
<path d="M112 281 Q98 314 113 326 Q132 335 145 299Z" fill="#7798ac"/><path d="M208 281 Q222 314 207 326 Q188 335 175 299Z" fill="#7798ac"/>
<path d="M114 314 Q131 327 148 316 L145 336 L114 336Z" fill="#476477"/><path d="M172 316 Q189 327 206 314 L206 336 L175 336Z" fill="#476477"/>
