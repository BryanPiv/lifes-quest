<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360">
<defs>
<radialGradient id="a"><stop stop-color="#ecf8ff" stop-opacity=".42"/><stop offset="1" stop-color="#8eb9d4" stop-opacity="0"/></radialGradient>
<linearGradient id="b" x1=".15" y1=".05" x2=".85" y2=".95"><stop stop-color="#fff"/><stop offset=".34" stop-color="#e3f0f8"/><stop offset=".72" stop-color="#9fbed0"/><stop offset="1" stop-color="#506b7e"/></linearGradient>
<linearGradient id="c"><stop stop-color="#fff"/><stop offset="1" stop-color="#c7dce8"/></linearGradient>
<linearGradient id="pack" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#24648a"/><stop offset=".6" stop-color="#15415f"/><stop offset="1" stop-color="#08273c"/></linearGradient>
<linearGradient id="strap"><stop stop-color="#8b5a34"/><stop offset="1" stop-color="#4f2f1d"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#fff"/><stop offset=".22" stop-color="#7df7ff"/><stop offset=".55" stop-color="#15c9ff"/><stop offset="1" stop-color="#0b65ff"/></radialGradient>
<filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity=".45"/></filter>
<filter id="g"><feGaussianBlur stdDeviation="7"/></filter>
<style>
@keyframes blink{0%,45%,49%,100%{transform:scaleY(1)}46%,48%{transform:scaleY(.08)}}
@keyframes wave{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(10deg)}}
@keyframes pulse{0%,100%{opacity:.45;transform:scale(.95)}50%{opacity:1;transform:scale(1.08)}}
#eyes{transform-origin:160px 129px;animation:blink 6s ease-in-out infinite}
#waveArm{transform-origin:100px 205px;animation:wave 2.8s ease-in-out infinite}
#badgeGlow{transform-origin:160px 242px;animation:pulse 2.3s ease-in-out infinite}
</style>
</defs>
<ellipse cx="160" cy="185" rx="128" ry="143" fill="url(#a)"/>
<g filter="url(#s)">
<ellipse cx="160" cy="326" rx="84" ry="16" fill="#000" opacity=".22"/>
