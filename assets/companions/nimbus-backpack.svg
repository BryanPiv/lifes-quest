<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400">
<defs>
 <radialGradient id="cloud" cx=".34" cy=".18"><stop stop-color="#ffffff"/><stop offset=".38" stop-color="#f5fbff"/><stop offset=".72" stop-color="#d8e8f2"/><stop offset="1" stop-color="#9ab7c8"/></radialGradient>
 <linearGradient id="body" x1=".15" y1=".05" x2=".85" y2=".95"><stop stop-color="#fff"/><stop offset=".45" stop-color="#edf7fb"/><stop offset=".76" stop-color="#c9dce7"/><stop offset="1" stop-color="#8daab9"/></linearGradient>
 <linearGradient id="pack" x1=".05" y1=".05" x2=".95" y2=".95"><stop stop-color="#3a87b5"/><stop offset=".42" stop-color="#1d5a83"/><stop offset="1" stop-color="#0a2e49"/></linearGradient>
 <linearGradient id="strap" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b87545"/><stop offset="1" stop-color="#5f3520"/></linearGradient>
 <radialGradient id="eye"><stop stop-color="#fff"/><stop offset=".16" stop-color="#8ef8ff"/><stop offset=".36" stop-color="#27d2ff"/><stop offset=".63" stop-color="#0b79c8"/><stop offset=".84" stop-color="#073457"/><stop offset="1" stop-color="#02121e"/></radialGradient>
 <radialGradient id="core"><stop stop-color="#fff"/><stop offset=".18" stop-color="#b4ffff"/><stop offset=".45" stop-color="#25ddf8"/><stop offset=".72" stop-color="#069ee0"/><stop offset="1" stop-color="#04528c"/></radialGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="15" stdDeviation="11" flood-opacity=".48"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="10"/></filter>
 <style>
 @keyframes blink{0%,44%,48%,100%{transform:scaleY(1)}46%{transform:scaleY(.06)}} #eyes{transform-origin:180px 142px;animation:blink 5.6s ease-in-out infinite}
 @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}} #nimbus{animation:float 3s ease-in-out infinite}
 @keyframes pulse{0%,100%{opacity:.35;transform:scale(.92)}50%{opacity:.95;transform:scale(1.12)}} #coreGlow{transform-origin:180px 278px;animation:pulse 2.15s ease-in-out infinite}
 </style>
</defs>
<ellipse cx="180" cy="363" rx="82" ry="16" fill="#000" opacity=".24"/>
<g id="nimbus" filter="url(#shadow)">
 <!-- backpack -->
 <path d="M95 210C72 213 61 232 64 279l8 43c16 12 36 12 52 1l8-85c-5-18-18-29-37-28Z" fill="url(#pack)" stroke="#082638" stroke-width="5"/>
 <path d="M265 210c23 3 34 22 31 69l-8 43c-16 12-36 12-52 1l-8-85c5-18 18-29 37-28Z" fill="url(#pack)" stroke="#082638" stroke-width="5"/>
 <path d="M79 244h36v37H79z" fill="#174a68" stroke="#74b7d7" stroke-width="3"/><path d="M245 244h36v37h-36z" fill="#174a68" stroke="#74b7d7" stroke-width="3"/>
 <!-- head cloud lobes -->
 <circle cx="180" cy="120" r="68" fill="url(#cloud)"/>
 <circle cx="118" cy="136" r="46" fill="url(#cloud)"/>
 <circle cx="242" cy="136" r="46" fill="url(#cloud)"/>
 <circle cx="141" cy="88" r="42" fill="url(#cloud)"/>
 <circle cx="218" cy="87" r="43" fill="url(#cloud)"/>
 <ellipse cx="180" cy="148" rx="82" ry="66" fill="url(#cloud)"/>
 <!-- rim lights -->
 <path d="M112 123c11-41 39-66 69-69" fill="none" stroke="#fff" stroke-width="7" opacity=".56" stroke-linecap="round"/>
 <path d="M223 74c28 7 47 27 55 51" fill="none" stroke="#dff8ff" stroke-width="5" opacity=".38" stroke-linecap="round"/>
 <!-- eyes -->
 <g id="eyes">
  <ellipse cx="145" cy="143" rx="18" ry="23" fill="#061724"/><ellipse cx="215" cy="143" rx="18" ry="23" fill="#061724"/>
  <ellipse cx="145" cy="145" rx="11.5" ry="17" fill="url(#eye)"/><ellipse cx="215" cy="145" rx="11.5" ry="17" fill="url(#eye)"/>
  <circle cx="151" cy="135" r="5.5" fill="#fff"/><circle cx="221" cy="135" r="5.5" fill="#fff"/>
  <circle cx="141" cy="152" r="2.4" fill="#c6ffff" opacity=".95"/><circle cx="211" cy="152" r="2.4" fill="#c6ffff" opacity=".95"/>
 </g>
 <ellipse cx="135" cy="169" rx="12" ry="5" fill="#f4b6c2" opacity=".23"/><ellipse cx="225" cy="169" rx="12" ry="5" fill="#f4b6c2" opacity=".23"/>
 <path d="M168 173q12 14 24 0c-3 18-21 19-24 0Z" fill="#28465a"/>
 <!-- body -->
 <path d="M123 219q57-31 114 0l-9 104q-48 39-96 0Z" fill="url(#body)" stroke="#b8cfda" stroke-width="2.5"/>
 <path d="M129 220q10 24 20 76M231 220q-10 24-20 76" fill="none" stroke="url(#strap)" stroke-width="13" stroke-linecap="round"/>
 <rect x="140" y="245" width="17" height="14" rx="3" fill="#c6d4db" stroke="#475f6c" stroke-width="2"/><rect x="203" y="245" width="17" height="14" rx="3" fill="#c6d4db" stroke="#475f6c" stroke-width="2"/>
 <!-- arms / cloud hands -->
 <path d="M124 233c-24-9-42 4-43 21-17 8-17 31 2 39 15 9 36 1 46-14Z" fill="url(#cloud)"/>
 <path d="M236 233c24-9 42 4 43 21 17 8 17 31-2 39-15 9-36 1-46-14Z" fill="url(#cloud)"/>
 <!-- core -->
 <circle id="coreGlow" cx="180" cy="278" r="36" fill="#28def8" opacity=".5" filter="url(#glow)"/>
 <circle cx="180" cy="278" r="29" fill="#e7fbff" stroke="#6d91a3" stroke-width="4"/>
 <circle cx="180" cy="278" r="20" fill="url(#core)" stroke="#1ec7ed" stroke-width="3"/>
 <circle cx="180" cy="278" r="8" fill="#fff"/>
 <!-- legs -->
 <path d="M138 314q-8 28 3 46h28l3-41Z" fill="url(#body)"/><path d="M222 314q8 28-3 46h-28l-3-41Z" fill="url(#body)"/>
 <path d="M132 353q18 9 39 0l-3 20h-43q-3-13 7-20Z" fill="#8aa7b7" stroke="#557181" stroke-width="3"/>
 <path d="M228 353q-18 9-39 0l3 20h43q3-13-7-20Z" fill="#8aa7b7" stroke="#557181" stroke-width="3"/>
 <!-- glossy highlights -->
 <path d="M145 225q35-13 69 0" fill="none" stroke="#fff" stroke-width="5" opacity=".28" stroke-linecap="round"/>
</g>
</svg>