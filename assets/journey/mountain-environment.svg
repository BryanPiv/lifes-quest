<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 560">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#064c8d"/>
    <stop offset=".35" stop-color="#1788c4"/>
    <stop offset=".66" stop-color="#8fc9dc"/>
    <stop offset=".84" stop-color="#f2c17b"/>
    <stop offset="1" stop-color="#173244"/>
  </linearGradient>
  <radialGradient id="sunGlow">
    <stop offset="0" stop-color="#fffbe0"/>
    <stop offset=".18" stop-color="#fff2a2"/>
    <stop offset=".42" stop-color="#ffd35d" stop-opacity=".95"/>
    <stop offset=".72" stop-color="#ffae3d" stop-opacity=".28"/>
    <stop offset="1" stop-color="#ffae3d" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="snow" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#f8fdff"/><stop offset=".48" stop-color="#dcebf4"/><stop offset="1" stop-color="#96b4cb"/>
  </linearGradient>
  <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#b9d4e5"/><stop offset=".45" stop-color="#7fa8bf"/><stop offset="1" stop-color="#537889"/>
  </linearGradient>
  <linearGradient id="mid" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#55777c"/><stop offset=".45" stop-color="#284c4b"/><stop offset="1" stop-color="#102f31"/>
  </linearGradient>
  <linearGradient id="peak" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#4d765d"/><stop offset=".25" stop-color="#2d6144"/><stop offset=".58" stop-color="#164232"/><stop offset="1" stop-color="#082a27"/>
  </linearGradient>
  <linearGradient id="peakShadow" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#224d47"/><stop offset="1" stop-color="#071d24"/>
  </linearGradient>
  <linearGradient id="lake" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#d9fbff"/><stop offset=".25" stop-color="#86d9ea"/><stop offset=".62" stop-color="#2f9bc0"/><stop offset="1" stop-color="#0a5e89"/>
  </linearGradient>
  <linearGradient id="forest" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#276a45"/><stop offset=".55" stop-color="#0e452f"/><stop offset="1" stop-color="#05281f"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="10"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="2.5"/></filter>
  <filter id="sunRay" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.2"/></filter>
  <filter id="texture" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 .08"/></feComponentTransfer>
    <feBlend mode="overlay" in2="SourceGraphic"/>
  </filter>
</defs>

<!-- sky -->
<rect width="430" height="560" fill="url(#sky)"/>
<circle cx="340" cy="90" r="118" fill="url(#sunGlow)"/>
<circle cx="340" cy="90" r="36" fill="#fff2ad" opacity=".96"/>
<g stroke="#ffe99d" stroke-width="1.2" opacity=".18" filter="url(#sunRay)">
  <path d="M340 90 L420 18"/><path d="M340 90 L427 70"/><path d="M340 90 L424 130"/>
  <path d="M340 90 L395 180"/><path d="M340 90 L292 10"/><path d="M340 90 L264 32"/>
</g>

<!-- clouds -->
<g fill="#fff" opacity=".48">
  <ellipse cx="65" cy="108" rx="62" ry="17"/><ellipse cx="116" cy="124" rx="92" ry="20"/>
  <ellipse cx="220" cy="144" rx="112" ry="21"/><ellipse cx="300" cy="166" rx="86" ry="17"/>
</g>
<g fill="#eaf7ff" opacity=".32">
  <ellipse cx="58" cy="86" rx="32" ry="12"/><ellipse cx="101" cy="95" rx="44" ry="14"/>
  <ellipse cx="246" cy="118" rx="54" ry="15"/><ellipse cx="289" cy="130" rx="44" ry="13"/>
</g>

<!-- distant snowy range -->
<path d="M0 276 L26 245 L55 257 L84 216 L113 249 L145 201 L179 239 L214 189 L247 230 L276 178 L313 229 L347 163 L384 220 L430 186 L430 320 L0 320Z" fill="url(#far)" opacity=".95"/>
<g fill="url(#snow)" opacity=".92">
  <path d="M68 236 L84 216 L96 239 L84 233Z"/>
  <path d="M132 219 L145 201 L159 224 L146 217Z"/>
  <path d="M198 208 L214 189 L229 216 L214 208Z"/>
  <path d="M261 199 L276 178 L291 208 L276 198Z"/>
  <path d="M332 186 L347 163 L365 198 L348 184Z"/>
  <path d="M412 204 L430 186 L430 221Z"/>
