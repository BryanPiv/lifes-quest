<!-- mid range -->
<path d="M0 350 L51 293 L89 327 L133 274 L170 325 L213 268 L258 330 L306 252 L352 312 L394 268 L430 304 L430 404 L0 404Z" fill="url(#mid)" opacity=".98"/>
<g fill="#c9e0e9" opacity=".55">
  <path d="M115 296 L133 274 L149 303 L133 294Z"/>
  <path d="M198 289 L213 268 L232 302 L214 288Z"/>
  <path d="M287 277 L306 252 L326 290 L307 274Z"/>
  <path d="M379 286 L394 268 L412 299 L394 285Z"/>
</g>

<!-- lake and valley -->
<path d="M92 382 C147 360 196 360 239 374 C279 387 313 386 351 368 C326 401 289 423 243 430 C193 439 145 425 92 402Z" fill="url(#lake)" opacity=".95"/>
<path d="M111 390 C164 377 213 379 252 390" fill="none" stroke="#f7ffff" stroke-width="3" opacity=".75"/>
<path d="M146 405 C194 397 238 402 278 410" fill="none" stroke="#b9f1ff" stroke-width="2" opacity=".65"/>

<!-- hero mountain -->
<path d="M198 560 L230 486 L258 425 L282 366 L303 305 L320 242 L341 142 L359 205 L376 264 L395 333 L430 404 L430 560Z" fill="url(#peak)" filter="url(#texture)"/>
<path d="M341 142 L359 205 L376 264 L395 333 L430 404 L430 560 L347 560 L351 482 L354 411 L355 337 L350 267Z" fill="url(#peakShadow)" opacity=".86"/>
<path d="M321 225 L341 142 L361 222 L347 210 L339 187 L333 213Z" fill="#f7fdff"/>
<path d="M331 205 L341 142 L350 208 L343 193 L338 217Z" fill="#dceaf0"/>
<path d="M348 181 L354 199 L361 222 L352 215Z" fill="#90b0c0" opacity=".7"/>

<!-- mountain vegetation streaks -->
<g stroke-linecap="round" opacity=".5">
  <path d="M285 358 L320 255" stroke="#71a65e" stroke-width="8"/>
  <path d="M305 405 L343 276" stroke="#477f4d" stroke-width="10"/>
  <path d="M333 445 L372 324" stroke="#2b6a43" stroke-width="12"/>
  <path d="M356 500 L396 389" stroke="#144d35" stroke-width="14"/>
</g>

<!-- foreground hills -->
<path d="M0 560 L0 374 L42 333 L77 367 L111 322 L153 374 L189 342 L226 396 L246 560Z" fill="url(#forest)"/>
<path d="M0 497 C54 460 108 452 158 468 C195 480 219 487 251 480 L251 560 L0 560Z" fill="#073128" opacity=".9"/>

