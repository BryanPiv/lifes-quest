  <path d="M224 542 l10-38 10 38h-7l10 31H221l10-31z"/>
  <path d="M270 528 l9-35 9 35h-6l9 29H267l9-29z"/>
  <path d="M312 542 l10-39 10 39h-7l10 31H309l10-31z"/>
  <path d="M356 526 l9-35 9 35h-6l9 29H353l9-29z"/>
  <path d="M402 540 l10-38 10 38h-7l10 31H399l10-31z"/>
</g>

<!-- mist -->
<g fill="#e8f7fb" opacity=".16" filter="url(#soft)">
  <ellipse cx="165" cy="329" rx="120" ry="12"/>
  <ellipse cx="245" cy="358" rx="108" ry="10"/>
  <ellipse cx="142" cy="392" rx="95" ry="9"/>
</g>
</svg>