  <path d="M61 538 l10-37 10 37h-6l9 30H58l9-30z"/>
  <path d="M99 520 l9-35 9 35h-6l9 29H96l9-29z"/>
  <path d="M137 540 l10-39 10 39h-7l10 31H134l10-31z"/>
